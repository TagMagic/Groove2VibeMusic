  <script>
(function () {
  const PREVIEW_BASE = "/g2v/audio/previews/"; // adjust if needed
  const player = new Audio();
  player.preload = "metadata";
  player.loop = false;

  let currentBtn = null;

  function stop() {
    player.pause();
    player.currentTime = 0;
    currentBtn = null;
  }

  player.addEventListener("ended", () => { currentBtn = null; });
  player.addEventListener("error", () => { stop(); });

  function buildSrc(key) {
    key = (key || "").trim();
    if (!key) return null;

    // If full path or URL provided, use it as-is
    if (key.includes("/") || key.startsWith("http")) return key;

    // If extension provided, append to base
    if (/\.(mp3|wav|m4a)$/i.test(key)) return PREVIEW_BASE + key;

    // Otherwise treat as filename stem
    return PREVIEW_BASE + key + ".mp3";
  }

  function bind() {
    document.querySelectorAll("[data-audio-preview]").forEach((btn) => {
      if (btn.dataset.bound === "1") return;
      btn.dataset.bound = "1";

      btn.addEventListener("click", async (e) => {
        e.preventDefault();

        const src = buildSrc(btn.getAttribute("data-audio-preview"));
        if (!src) return;

        // Same button toggles stop
        if (!player.paused && currentBtn === btn) {
          stop();
          return;
        }

        // Stop any currently playing preview
        if (!player.paused) stop();

        try {
          player.src = src;
          currentBtn = btn;
          await player.play(); // user click -> mobile safe
        } catch {
          stop();
        }
      });
    });
  }

  bind();
  new MutationObserver(bind).observe(document.body, { childList: true, subtree: true });
})();
</script>
